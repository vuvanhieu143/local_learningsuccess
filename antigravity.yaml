version: "1.0"
project: "local_learningsuccess"
workspace_root: "./local/learningsuccess"

environment:
  target_moodle: "5.0+"
  php_version: "8.2+"
  db_engine: "XMLDB"

workflows:
  build_mvp:
    stages:
      - name: "Phase 1: Foundation & Data Layer"
        agent: "moodle-architect"
        tasks:
          - create_plugin_skeleton
          - build_xmldb_schema
          - define_capabilities
          - scaffold_privacy_provider

      - name: "Phase 2: Analytics & Explanation Engine"
        agent: "moodle-core-engine"
        tasks:
          - implement_analytics_adapter
          - build_explanation_engine
          - implement_signal_collector_rules
          - configure_muc_cache

      - name: "Phase 3: Interventions & Async Workers"
        agent: "moodle-core-engine"
        tasks:
          - implement_recommendation_engine
          - build_intervention_manager
          - build_outcome_tracker
          - implement_event_observers_and_tasks

      - name: "Phase 4: Frontend & API"
        agent: "moodle-ui-dev"
        tasks:
          - build_external_services
          - generate_mustache_templates
          - implement_amd_modules
          - build_chart_renderers

      - name: "Phase 5: Compliance & Testing"
        agent: "moodle-qa-auditor"
        tasks:
          - generate_phpunit_domain_tests
          - generate_behat_workflows
          - run_moodle_codesniffer

